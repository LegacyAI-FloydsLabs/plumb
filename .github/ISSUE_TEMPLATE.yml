name: Bug Report
description: Report something that is broken or incorrect
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What did you expect to happen, and what actually happened?
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug? Be specific.
      placeholder: |
        1. Go to '...'
        2. Enter '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Environment
      description: "Browser, OS, tool version, etc."
      placeholder: "Chrome on macOS, tool version 0.9.0"
    validations:
      required: false
