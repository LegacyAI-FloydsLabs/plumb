name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          set -e
          # DCO enforcement starts at governance adoption commit.
          # Pre-governance commits are grandfathered (no Signed-off-by).
          CUTOFF="2953c05ea2d36e893ae5d88f667aec43691703760"
          for commit in $(git rev-list --no-merges "${CUTOFF}..HEAD"); do
            if ! git log -1 --format='%B' "$commit" | grep -qi "Signed-off-by"; then
              echo "ERROR: Commit $commit lacks DCO sign-off"
              echo "Every commit must contain: Signed-off-by: Name <email>"
              echo "See: https://developercertificate.org/"
              exit 1
            fi
          done
          echo "All commits pass DCO sign-off check."

  build:
    runs-on: ubuntu-latest
    needs: dco
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: dco
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm test

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: "./lighthouserc.json"
          budgetPath: "./lighthouse-budget.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
